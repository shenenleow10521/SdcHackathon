<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HalaTuju</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Layout: a career app. Left: planner sidebar with Jobs / Path / My skills tabs. Right: a dark "night sky" stage holding the 3D career constellation, with floating agents, timeline, legend and a detail drawer. A first-use onboarding modal sits on top. */
:root {
  --bg: #f3f4f6;
  --panel: #ffffff;
  --panel-2: #f6f7f9;
  --ink: #0c1220;
  --ink-2: #475163;
  --muted: #687284;
  --line: #e5e7eb;
  --line-2: #d9dde3;
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --accent-wash: #eaf2fd;
  --good: #0b7a2b; --good-wash: #e4f5e8;
  --warn: #8a5300; --warn-wash: #fdf1d8;
  --crit: #b42828; --crit-wash: #fce8e8;
  --violet: #5b4bd0; --violet-wash: #efedfc;
  --shadow-1: 0 1px 2px rgba(12, 18, 32, 0.06);
  --shadow-2: 0 2px 4px rgba(12, 18, 32, 0.06), 0 6px 8px rgba(12, 18, 32, 0.05);
  --split-ai: #8b95a6; --split-assist: #c9d0da; --split-you: #2a78d6;

  /* the stage is a deliberate night sky in both themes */
  --stage-a: #142036;
  --stage-b: #05070c;
  --ring: rgba(160, 182, 214, 0.18);
  --ring-label: rgba(190, 205, 228, 0.55);
  --n-you: #f4f6fa;
  --n-have: #3987e5;
  --n-learn: #199e70;
  --n-job: #e3672f;
  --n-risk: #e66767;
  --n-taken: #4b5466;
  --l-base: rgba(170, 186, 212, 0.20);
  --l-dead: rgba(230, 103, 103, 0.10);
  --l-path: #f08a5d;
  --l-evolve: #9085e9;
  --l-alt: rgba(214, 224, 238, 0.55);
  --particle: #ffffff;

  --font: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  --z-scene: 1; --z-labels: 2; --z-ui: 10; --z-drawer: 20; --z-toast: 30; --z-tip: 40; --z-modal: 50;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0c11; --panel: #12151c; --panel-2: #181c25; --ink: #e9ecf2; --ink-2: #aab3c2; --muted: #8790a0; --line: #232835; --line-2: #2e3443;
    --accent: #3987e5; --accent-wash: #15253a;
    --good: #7fd38f; --good-wash: #14281a; --warn: #f0c56a; --warn-wash: #2d2410; --crit: #f19c9c; --crit-wash: #321a1a; --violet: #a99ff0; --violet-wash: #221f3d;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4); --shadow-2: 0 2px 4px rgba(0, 0, 0, 0.35), 0 6px 8px rgba(0, 0, 0, 0.3);
    --split-ai: #6b7486; --split-assist: #3a4252; --split-you: #3987e5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0c11; --panel: #12151c; --panel-2: #181c25; --ink: #e9ecf2; --ink-2: #aab3c2; --muted: #8790a0; --line: #232835; --line-2: #2e3443;
  --accent: #3987e5; --accent-wash: #15253a;
  --good: #7fd38f; --good-wash: #14281a; --warn: #f0c56a; --warn-wash: #2d2410; --crit: #f19c9c; --crit-wash: #321a1a; --violet: #a99ff0; --violet-wash: #221f3d;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4); --shadow-2: 0 2px 4px rgba(0, 0, 0, 0.35), 0 6px 8px rgba(0, 0, 0, 0.3);
  --split-ai: #6b7486; --split-assist: #3a4252; --split-you: #3987e5;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.lucide { width: 16px; height: 16px; stroke-width: 2; flex: none; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.app { height: 100%; display: grid; grid-template-columns: 408px minmax(0, 1fr); grid-template-areas: "side stage"; }
.side { grid-area: side; min-width: 0; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); overflow: hidden; }
.side-head { padding-block: 16px 14px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 18px; display: grid; gap: 14px; border-bottom: 1px solid var(--line); }
.side-body { flex: 1; overflow-y: auto; padding-block: 16px 28px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 18px; }
.stage { grid-area: stage; position: relative; min-width: 0; overflow: hidden; background: radial-gradient(ellipse 80% 70% at 42% 48%, var(--stage-a) 0%, var(--stage-b) 78%); }
.agents { grid-area: stage; align-self: start; justify-self: end; z-index: var(--z-ui); margin: 16px max(16px, env(safe-area-inset-right, 0px)) 0 0; width: 300px; }

@media (max-width: 980px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-areas: "stage" "agents" "side"; }
  .stage { height: 66svh; min-height: 460px; }
  .agents { justify-self: stretch; width: auto; margin: 12px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
  .side { border-right: 0; overflow: visible; }
  .side-body { overflow: visible; }
  .side-head, .side-body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}

/* ---------- sidebar head ---------- */
.brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16.5px; letter-spacing: -0.015em; }
.logo-mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(145deg, #3a8be6, #1f5fb3); display: grid; place-items: center; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.logo-mark svg { width: 15px; height: 15px; }
.brand-right { display: flex; align-items: center; gap: 6px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; line-height: 1.5; }
.badge svg { width: 12px; height: 12px; }
.b-warn { background: var(--warn-wash); color: var(--warn); }
.b-good { background: var(--good-wash); color: var(--good); }
.b-crit { background: var(--crit-wash); color: var(--crit); }
.b-info { background: var(--accent-wash); color: var(--accent); }
.b-violet { background: var(--violet-wash); color: var(--violet); }
.b-mute { background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line); }
.ghost { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-sm); height: 30px; padding: 0 9px; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 550; color: var(--ink-2); transition: background-color .15s ease-out, border-color .15s ease-out; }
.ghost:hover { background: var(--panel-2); border-color: var(--line-2); color: var(--ink); }

.me { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-wash); color: var(--accent); display: grid; place-items: center; font-weight: 650; font-size: 14px; }
.me .name { font-weight: 600; }
.me .meta { color: var(--ink-2); font-size: 12.5px; }
.score-mini { text-align: right; }
.score-mini .v { font-size: 22px; font-weight: 600; line-height: 1; }
.score-mini .v small { font-size: 12px; color: var(--ink-2); }
.score-mini .l { font-size: 11px; color: var(--muted); margin-top: 3px; }
.scorebar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; }
.scorebar .t { font-size: 12.5px; color: var(--ink-2); }
.scorebar .t b { color: var(--ink); font-weight: 600; }
.scorebar .t .up { color: var(--good); font-weight: 600; }
.scorebar svg.spark { width: 92px; height: 28px; }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.tab { border: 0; background: transparent; border-radius: 7px; height: 32px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 550; color: var(--ink-2); transition: background-color .15s ease-out, color .15s ease-out; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-1); }

/* ---------- sidebar body ---------- */
.h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 0 10px; }
.h2 h2 { margin: 0; font-size: 13.5px; font-weight: 600; }
.h2 span { font-size: 12px; color: var(--muted); }
.stack { display: grid; gap: 20px; }

.search { position: relative; }
.search input { width: 100%; height: 42px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel); padding: 0 12px 0 38px; font-size: 14px; transition: border-color .15s ease-out, box-shadow .15s ease-out; }
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
.search > svg { position: absolute; left: 12px; top: 13px; color: var(--muted); }
.results { display: grid; gap: 6px; margin-top: 8px; }
.result { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 11px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; transition: border-color .15s ease-out; }
.result:hover { border-color: var(--line-2); }
.result .ic { width: 28px; height: 28px; border-radius: 8px; background: var(--panel-2); display: grid; place-items: center; color: var(--ink-2); }
.result .rn { font-weight: 600; font-size: 13.5px; }
.result .rm { font-size: 12px; color: var(--ink-2); }
.result .rp { font-size: 15px; font-weight: 600; }
.found { border: 1px dashed var(--line-2); border-radius: 10px; padding: 12px; display: grid; gap: 8px; }
.found .fn { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.found .fn b { font-size: 14px; }
.found p { margin: 0; font-size: 12.5px; color: var(--ink-2); }
.loading { display: flex; gap: 8px; align-items: center; color: var(--ink-2); font-size: 12.5px; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent-wash); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }

.jobs { display: grid; gap: 10px; }
.job { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 9px; transition: border-color .18s ease-out, box-shadow .18s ease-out; position: relative; }
.job:hover { border-color: var(--line-2); box-shadow: var(--shadow-1); }
.job[aria-pressed="true"] { border-color: var(--n-job); box-shadow: 0 0 0 1px var(--n-job); }
.job-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.job-name { font-weight: 600; font-size: 14px; line-height: 1.3; }
.job-tags { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
.job-pct { font-size: 24px; font-weight: 600; line-height: 1; text-align: right; }
.job-pct small { font-size: 11px; color: var(--muted); display: block; margin-top: 4px; font-family: var(--font); font-weight: 500; letter-spacing: 0; }
.bar { height: 6px; border-radius: 3px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #e3672f, #f08a5d); border-radius: 3px; transition: width .35s cubic-bezier(.22,1,.36,1); }
.job-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.job-meta span { display: inline-flex; align-items: center; gap: 5px; }
.job-meta svg { width: 13px; height: 13px; color: var(--muted); }

.path-head { display: grid; gap: 10px; }
.path-title { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.path-title h2 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.seg { display: inline-grid; grid-auto-flow: column; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 6px; font-size: 12.5px; color: var(--ink-2); font-weight: 550; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-1); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; }
.tile .k { font-size: 11.5px; color: var(--muted); }
.tile .v { font-size: 18px; font-weight: 600; margin-top: 2px; }
.tile .v small { font-size: 12px; color: var(--ink-2); font-family: var(--font); font-weight: 500; }
.mode-note { font-size: 12.5px; color: var(--ink-2); margin: 0; }

.steps { list-style: none; margin: 0; padding: 0; display: grid; }
.step { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 11px; padding: 10px 8px; margin: 0 -8px; border-radius: 10px; position: relative; cursor: pointer; transition: background-color .15s ease-out; }
.step:hover { background: var(--panel-2); }
.step:not(:last-child)::before { content: ""; position: absolute; left: 22px; top: 40px; bottom: -10px; width: 2px; background: repeating-linear-gradient(to bottom, var(--line-2) 0 3px, transparent 3px 7px); }
.sico { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; position: relative; z-index: 1; }
.sico svg { width: 15px; height: 15px; }
.k-start { background: var(--ink); color: var(--panel); }
.k-reuse { background: var(--accent-wash); color: var(--accent); }
.k-upskill { background: var(--good-wash); color: var(--good); }
.k-evolve { background: var(--violet-wash); color: var(--violet); }
.k-reskill { background: var(--panel); color: #0f8a5f; box-shadow: inset 0 0 0 2px #199e70; }
.k-arrive { background: var(--n-job); color: #fff; }
.step .t { font-weight: 600; font-size: 13.5px; }
.step .ty { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 1px; }
.step .s { color: var(--ink-2); font-size: 12.5px; margin-top: 1px; }
.step .w { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; padding-top: 4px; }
.sub-h { font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 16px 0 4px; display: flex; align-items: center; gap: 6px; }
.approve { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 8px; }
.btn { height: 40px; border: 0; border-radius: 10px; padding: 0 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: filter .15s ease-out, background-color .15s ease-out, transform .1s ease-out; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), var(--shadow-1); }
.btn-primary:hover { filter: brightness(1.06); }
.btn-primary:disabled { opacity: .6; cursor: default; filter: none; transform: none; }
.btn-soft { background: var(--panel-2); border: 1px solid var(--line); color: var(--ink); }
.btn-soft:hover { background: var(--line); }
.note { font-size: 12.5px; color: var(--ink-2); margin: 0; }
.foot { font-size: 11.5px; color: var(--muted); margin: 18px 0 0; }

.split { display: grid; gap: 8px; }
.split-bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
.split-bar i { display: block; height: 100%; transition: flex-basis .4s cubic-bezier(.22,1,.36,1); }
.split-key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.split-key span { display: inline-flex; align-items: center; gap: 6px; }
.split-key i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.card { border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; background: var(--panel); display: grid; gap: 10px; }
.card.edge { background: linear-gradient(180deg, var(--good-wash), var(--panel) 70%); border-color: color-mix(in srgb, var(--good) 25%, var(--line)); }
.card h3 { margin: 0; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.card p { margin: 0; font-size: 12.5px; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 550; display: inline-flex; align-items: center; gap: 6px; transition: border-color .15s ease-out; }
.chip:hover { border-color: var(--line-2); }
.skills { display: grid; }
.skill { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 8px; margin: 0 -8px; border-radius: 10px; cursor: pointer; text-align: left; border: 0; background: transparent; transition: background-color .15s ease-out; }
.skill:hover { background: var(--panel-2); }
.skill + .skill { border-top: 1px solid var(--line); border-radius: 0; }
.skill .sn { font-weight: 550; font-size: 13.5px; }
.skill .sm { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
.dots i.on { background: var(--accent); }

.sectors { display: flex; flex-wrap: wrap; gap: 6px; }
.sector { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; font-weight: 550; display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); transition: background-color .15s ease-out, color .15s ease-out, border-color .15s ease-out; }
.sector svg { width: 14px; height: 14px; }
.sector:hover { border-color: var(--line-2); color: var(--ink); }
.sector[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.sector-note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.try { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.try button { border: 0; background: var(--panel-2); color: var(--ink-2); border-radius: 6px; padding: 3px 8px; font-size: 12px; font-weight: 550; }
.try button:hover { color: var(--accent); }

/* admin view */
.count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--n-job); color: #fff; font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; font-family: var(--mono); }
.count[hidden], .tabs[hidden] { display: none; }
.ghost[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.admin-banner { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.admin-banner h2 { margin: 2px 0 6px; font-size: 18px; font-weight: 600; }
.tiles-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.flow { display: grid; gap: 7px; font-size: 12.5px; color: var(--ink-2); background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; }
.flow div { display: flex; gap: 9px; align-items: center; }
.flow b { width: 20px; height: 20px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line-2); display: grid; place-items: center; font-size: 11px; font-family: var(--mono); flex: none; color: var(--ink); }
.rv { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 7px; background: var(--panel); }
.rv + .rv { margin-top: 10px; }
.rv-top { display: flex; flex-wrap: wrap; gap: 6px; }
.rv-t { font-weight: 600; font-size: 13.5px; }
.rv-m { font-size: 12.5px; color: var(--ink-2); }
.rv-q { margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--panel-2); font-size: 12.5px; color: var(--ink-2); font-style: italic; }
.rv-s { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.rv-s svg { width: 13px; height: 13px; }
.rv-actions { display: flex; gap: 8px; margin-top: 2px; flex-wrap: wrap; }
.rv-actions .btn { height: 34px; font-size: 13px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.checks li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; font-size: 12.5px; }
.checks li svg { width: 15px; height: 15px; }
.checks li .rs { font-size: 11.5px; color: var(--muted); }
.handled { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.handled li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.handled li svg { width: 15px; height: 15px; margin-top: 2px; }
.handled li b { color: var(--ink); font-weight: 600; display: block; font-size: 12px; }
.empty { border: 1px dashed var(--line-2); border-radius: var(--r-md); padding: 14px; font-size: 12.5px; color: var(--ink-2); }

/* ---------- stage overlays ---------- */
#stars { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene { position: absolute; top: 0; bottom: 0; left: -240px; right: 0; }
@media (max-width: 980px) { .scene { left: 0; } }
#rings { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: var(--z-scene); }
#graph { position: absolute; inset: 0; z-index: var(--z-scene); }
#labels { position: absolute; inset: 0; pointer-events: none; z-index: var(--z-labels); }
.glass { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-2); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.topbar { position: absolute; z-index: var(--z-ui); left: 16px; top: 16px; right: 336px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; font-size: 12px; color: var(--ink-2); }
.pill b { color: var(--ink); font-weight: 600; }
.live { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.18); }
.legend { display: flex; flex-wrap: wrap; gap: 5px 14px; padding: 7px 12px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.lg { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.lg.line { width: 14px; height: 3px; border-radius: 2px; }
@media (max-width: 980px) { .topbar { right: 16px; } .legend { display: none; } }

.agents { padding: 12px; display: grid; gap: 10px; }
.ag-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ag-head h3 { margin: 0; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.ag-toggle { border: 0; background: transparent; color: var(--muted); width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; }
.ag-toggle:hover { background: var(--panel-2); color: var(--ink); }
.ag-fresh { font-size: 11.5px; color: var(--muted); }
.ag-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.ag-list li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 9px; align-items: start; }
.ag-ic { width: 26px; height: 26px; border-radius: 7px; background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink-2); position: relative; }
.ag-ic svg { width: 14px; height: 14px; }
.ag-ic::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--panel); background: #22c55e; }
.ag-ic.idle::after { background: var(--muted); }
.ag-ic.run::after { background: var(--accent); animation: pulse 1s ease-out infinite; }
.ag-list .an { font-weight: 600; font-size: 12.5px; }
.ag-list .ad { font-size: 12px; color: var(--ink-2); }
.log { list-style: none; margin: 0; padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-sm); display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
.log li { display: flex; gap: 6px; }
.log li::before { content: "›"; color: var(--accent); font-weight: 700; }
.ag-actions { display: flex; gap: 8px; }
.ag-actions .btn { height: 36px; font-size: 13px; flex: 1; }
.agents.collapsed .ag-body { display: none; }
.ag-body { display: grid; gap: 10px; }

.timeline { position: absolute; z-index: var(--z-ui); left: calc(50% - 120px); transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 12px; padding: 7px 10px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px); }
.timeline input[type="range"] { width: 160px; accent-color: var(--accent); }
.year { font-size: 14px; font-weight: 600; min-width: 4ch; }
.icon-btn { width: 32px; height: 32px; border: 0; background: transparent; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--ink); }
.icon-btn:hover { background: var(--panel-2); }
.icon-btn[aria-pressed="true"] { background: var(--accent-wash); color: var(--accent); }
.viewctl { position: absolute; z-index: var(--z-ui); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; padding: 4px; gap: 2px; }
@media (max-width: 980px) { .timeline { left: 50%; gap: 8px; } .timeline input[type="range"] { width: 100px; } .viewctl { bottom: calc(72px + env(safe-area-inset-bottom, 0px)); } }

/* scene labels */
.lb { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 12px; font-weight: 550; color: #e9eef6; background: rgba(14, 20, 32, 0.78); border: 1px solid rgba(160, 182, 214, 0.22); border-radius: 999px; padding: 2px 9px; display: inline-flex; align-items: center; gap: 6px; will-change: transform; backdrop-filter: blur(4px); }
.lb.hide { display: none; }
.lb.job { flex-direction: column; gap: 0; border-radius: 10px; padding: 5px 11px; font-size: 12.5px; font-weight: 600; background: rgba(14, 20, 32, 0.88); }
.lb.job small { font-family: var(--mono); font-size: 11.5px; color: #f3b08e; font-weight: 500; }
.lb.job.sel { border-color: #f08a5d; box-shadow: 0 0 0 1px #f08a5d, 0 0 18px rgba(240, 138, 93, 0.35); }
.lb.you { background: #f4f6fa; color: #0c1220; border-color: transparent; font-weight: 650; }
.lb .n { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; border: 2px solid #199e70; color: #e9eef6; }
.lb .tg { font-size: 10.5px; font-weight: 700; letter-spacing: .02em; }
.tg.risk { color: #ff9b9b; } .tg.taken { color: #9aa4b6; } .tg.human { color: #7fe0a0; } .tg.new { color: #c3bbff; }
.ring-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; fill: var(--ring-label); font-family: var(--font); }
.incident { position: absolute; transform: translate(-50%, -100%); pointer-events: none; display: inline-flex; align-items: center; gap: 6px; background: #3a2a0c; color: #ffd27a; border: 1px solid #c98500; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 650; white-space: nowrap; box-shadow: 0 0 20px rgba(201, 133, 0, 0.35); }
.incident svg { width: 13px; height: 13px; }

/* drawer */
.drawer { position: absolute; z-index: var(--z-drawer); top: 12px; right: 12px; bottom: 12px; width: 384px; max-width: calc(100% - 24px); overflow-y: auto; padding: 18px; display: grid; align-content: start; gap: 18px; transform: translateX(calc(100% + 24px)); visibility: hidden; transition: transform .32s cubic-bezier(.22,1,.36,1), visibility 0s linear .32s; }
.drawer.open { transform: none; visibility: visible; transition: transform .32s cubic-bezier(.22,1,.36,1), visibility 0s; }
.dr-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.dr-kind { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 6px; }
.dr-head h2 { margin: 4px 0 8px; font-size: 19px; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; text-wrap: balance; }
.sec h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.levels { display: grid; gap: 4px; }
.lvl { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; font-size: 12.5px; color: var(--ink-2); }
.lvl b { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.lvl.cur { background: var(--accent-wash); color: var(--ink); }
.lvl.cur b { color: var(--accent); }
.lvl.need { box-shadow: inset 0 0 0 1px var(--n-job); }
.lvl .mk { font-size: 11px; font-weight: 600; }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.tasks li { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: 13px; }
.lpp { display: grid; gap: 8px; }
.lpp-item { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.lpp-item .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; }
.lpp-item .ic svg { width: 15px; height: 15px; }
.lpp-item .k { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.lpp-item .v { font-size: 13px; font-weight: 550; }
.lpp-item .m { font-size: 12px; color: var(--ink-2); }
.req { display: grid; }
.req-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; cursor: pointer; }
.req-row:first-child { border-top: 0; }
.req-row:hover .rn { color: var(--accent); }
.req-row .rn { font-weight: 550; }
.req-row .rs { font-size: 11.5px; color: var(--muted); }
.req-row .share { font-size: 12.5px; color: var(--ink-2); text-align: right; }
.cov { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }
.cov svg { width: 13px; height: 13px; }
.cov.full { background: var(--good-wash); color: var(--good); }
.cov.part { background: var(--warn-wash); color: var(--warn); }
.cov.none { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.big-pct { font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
.sdg { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.sdg b { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-family: var(--mono); font-size: 13px; }
.src { font-size: 11.5px; color: var(--muted); margin: 0; }

.toast { position: absolute; z-index: var(--z-toast); left: calc(50% - 120px); top: 66px; transform: translate(-50%, -8px); opacity: 0; padding: 11px 14px; display: grid; gap: 3px; width: min(440px, calc(100% - 32px)); pointer-events: none; transition: opacity .22s ease-out, transform .22s ease-out; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast .tt { font-weight: 600; display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.toast .td { font-size: 12.5px; color: var(--ink-2); }
.rerouting { position: absolute; z-index: var(--z-toast); left: calc(50% - 120px); top: 50%; transform: translate(-50%, -50%); padding: 10px 16px; font-weight: 600; display: inline-flex; gap: 10px; align-items: center; opacity: 0; pointer-events: none; transition: opacity .2s ease-out; }
.rerouting.show { opacity: 1; }
.tip { position: absolute; z-index: var(--z-tip); pointer-events: none; padding: 10px 12px; min-width: 220px; font-size: 12.5px; }
.tip b { display: block; font-size: 13px; margin-bottom: 2px; }
.tip .k { color: var(--muted); font-size: 11.5px; margin-bottom: 7px; display: block; }
.tip .row { display: flex; justify-content: space-between; gap: 12px; color: var(--ink-2); }
.tip .row span:last-child { color: var(--ink); font-weight: 600; font-family: var(--mono); }
.nograph { position: absolute; inset: 0; display: grid; place-items: center; color: #aab3c2; padding: 24px; text-align: center; }

/* onboarding */
.ob { position: fixed; inset: 0; z-index: var(--z-modal); display: grid; place-items: center; padding: 16px; background: rgba(5, 8, 14, 0.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.ob[hidden] { display: none; }
.ob-card { width: min(620px, 100%); max-height: calc(100% - 16px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: 0 8px 8px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.2); display: grid; }
.ob-top { padding: 20px 24px 0; display: grid; gap: 14px; }
.ob-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ob-steps i { height: 4px; border-radius: 2px; background: var(--line); transition: background-color .3s ease-out; }
.ob-steps i.on { background: var(--accent); }
.ob-kicker { font-size: 12px; color: var(--muted); font-weight: 550; }
.ob-top h2 { margin: 2px 0 0; font-size: 22px; font-weight: 600; letter-spacing: -0.015em; text-wrap: balance; }
.ob-top p { margin: 4px 0 0; color: var(--ink-2); }
.ob-body { padding: 18px 24px; display: grid; gap: 14px; }
.ob-foot { padding: 14px 24px 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--line); }
.ob-foot .left { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.drop { border: 1.5px dashed var(--line-2); border-radius: var(--r-md); padding: 18px; display: grid; gap: 12px; justify-items: center; text-align: center; background: var(--panel-2); }
.drop .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-wash); color: var(--accent); display: grid; place-items: center; }
.drop .ic svg { width: 20px; height: 20px; }
.file { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; text-align: left; }
.file .fi { width: 32px; height: 32px; border-radius: 8px; background: var(--crit-wash); color: var(--crit); display: grid; place-items: center; }
.file .fm { font-size: 12px; color: var(--muted); }
.found-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.found-list li { display: flex; gap: 10px; align-items: center; font-size: 13.5px; }
.found-list li svg { color: var(--good); }
.found-list li.warn svg { color: var(--warn); }
.q { display: grid; gap: 10px; }
.q-msg { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; }
.q-msg .bot { width: 30px; height: 30px; border-radius: 9px; background: var(--accent-wash); color: var(--accent); display: grid; place-items: center; }
.q-msg .bubble { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px 12px 12px 12px; padding: 9px 12px; font-size: 13.5px; }
.q-ans { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 40px; }
.q-ans button { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 550; transition: background-color .15s ease-out, border-color .15s ease-out; }
.q-ans button:hover { border-color: var(--accent); }
.q-ans button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.rate { display: grid; gap: 2px; }
.rate-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.rate-row:first-child { border-top: 0; }
.rate-row .rn { font-weight: 550; font-size: 13.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rate-row .rd { grid-column: 1 / -1; font-size: 12px; color: var(--ink-2); }
.lv { display: inline-grid; grid-auto-flow: column; gap: 3px; }
.lv button { width: 30px; height: 28px; border: 1px solid var(--line-2); background: var(--panel); border-radius: 7px; font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.lv button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(57,135,229,.55); } 100% { box-shadow: 0 0 0 7px rgba(57,135,229,0); } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .spin, .ag-ic.run::after { animation: none; }
  .drawer, .drawer.open, .toast, .rerouting, .bar i, .split-bar i, .job, .tab, .step, .skill { transition: none; }
}
@media (max-width: 980px) {
  .drawer { position: fixed; top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 78svh; transform: translateY(calc(100% + 24px)); }
  .toast, .rerouting { left: 50%; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Career planner">
    <div class="side-head">
      <div class="brand">
        <div class="logo"><span class="logo-mark"><i data-lucide="compass"></i></span>HalaTuju</div>
        <div class="brand-right">
          <span class="badge b-warn" title="All people, numbers, sources and courses here are sample data">Sample data</span>
          <button class="ghost" id="admin-btn" type="button" aria-pressed="false" title="Admin view: knowledge review queue"><i data-lucide="shield-check"></i>Review<span class="count" id="admin-count">4</span></button>
          <button class="ghost" id="replay" type="button" title="Replay first-time setup" aria-label="Replay first-time setup"><i data-lucide="rotate-ccw"></i></button>
        </div>
      </div>
      <div class="me">
        <div class="avatar" aria-hidden="true">PN</div>
        <div>
          <div class="name">Priya Nair</div>
          <div class="meta">Accounts payable clerk · 11 yrs · Penang</div>
        </div>
        <div class="score-mini"><div class="v num" id="score-now">60<small>%</small></div><div class="l">Future-proof</div></div>
      </div>
      <div class="scorebar" id="scorebar"></div>
      <div class="tabs" role="tablist" aria-label="Planner sections">
        <button class="tab" role="tab" id="tab-jobs" aria-selected="true" aria-controls="panel"><i data-lucide="briefcase"></i>Jobs</button>
        <button class="tab" role="tab" id="tab-path" aria-selected="false" aria-controls="panel"><i data-lucide="route"></i>Path</button>
        <button class="tab" role="tab" id="tab-skills" aria-selected="false" aria-controls="panel"><i data-lucide="layers"></i>My skills</button>
      </div>
    </div>
    <div class="side-body" id="panel" role="tabpanel"></div>
  </aside>

  <main class="stage" id="stage" aria-label="Career constellation">
    <canvas id="stars" aria-hidden="true"></canvas>
    <div class="scene">
      <svg id="rings" aria-hidden="true"></svg>
      <div id="graph"></div>
      <div id="labels"></div>
    </div>
    <div class="topbar">
      <div class="pill glass"><span class="live"></span><span>Knowledge updated <b id="fresh-when">3 days ago</b> · <b class="num" id="fresh-n">214</b> sources</span></div>
      <div class="legend glass" aria-label="Legend">
        <span><i class="lg" style="background:var(--n-you)"></i>You</span>
        <span><i class="lg" style="background:var(--n-have)"></i>Your skills</span>
        <span><i class="lg" style="background:var(--n-learn)"></i>Skills to learn</span>
        <span><i class="lg" style="background:var(--n-job)"></i>Jobs</span>
        <span><i class="lg" style="background:var(--n-risk)"></i>At risk</span>
        <span><i class="lg line" style="background:var(--l-path)"></i>Your path</span>
        <span><i class="lg line" style="background:var(--l-alt)"></i>Other routes</span>
        <span><i class="lg line" style="background:var(--l-evolve)"></i>Evolves into</span>
      </div>
    </div>
    <div class="toast glass" id="toast" role="status" aria-live="polite"></div>
    <div class="rerouting glass" id="rerouting"><span class="spin"></span>Finding a new path…</div>
    <div class="tip glass" id="tip" hidden></div>
    <aside class="drawer glass" id="drawer" aria-label="Details"></aside>
    <div class="timeline glass" role="group" aria-label="Forecast">
      <button class="icon-btn" id="play" type="button" aria-label="Play the forecast"><i data-lucide="play"></i></button>
      <input type="range" id="year" min="2026" max="2030" step="1" value="2026" aria-label="Forecast year">
      <span class="year num" id="year-out">2026</span>
      <div class="seg" role="group" aria-label="AI adoption speed">
        <button type="button" data-scn="moderate" aria-pressed="true">Moderate AI</button>
        <button type="button" data-scn="fast" aria-pressed="false">Fast AI</button>
      </div>
    </div>
    <div class="viewctl glass" role="group" aria-label="View">
      <button class="icon-btn" id="rotate" type="button" aria-pressed="true" aria-label="Stop rotating"><i data-lucide="rotate-3d"></i></button>
      <button class="icon-btn" id="labels-btn" type="button" aria-pressed="false" aria-label="Show all labels"><i data-lucide="type"></i></button>

  if (refresh(true)) toast("Path changed", `With ${S.scenario} AI adoption, a skill on your old path is no longer a safe bet.`, '<span class="badge b-info">New path</span>');
}));
$("year").addEventListener("input", e => { stopPlay(); S.year = +e.target.value; refresh(true); });
let playT = null;
function stopPlay() { if (playT) { clearInterval(playT); playT = null; $("play").innerHTML = '<i data-lucide="play"></i>'; icons(); } }
$("play").addEventListener("click", () => {
  if (playT) return stopPlay();
  if (S.year >= 2030) { S.year = 2026; refresh(); }
  $("play").innerHTML = '<i data-lucide="pause"></i>'; icons();
  playT = setInterval(() => { if (S.year >= 2030) return stopPlay(); S.year++; refresh(true); }, reduce ? 500 : 1200);
});
$("rotate").addEventListener("click", () => setRotate(!UI.rotating));
$("labels-btn").addEventListener("click", () => { UI.labelsAll = !UI.labelsAll; $("labels-btn").setAttribute("aria-pressed", String(UI.labelsAll)); updateLabels(); });
$("reset-view").addEventListener("click", () => resetView(true));
$("ag-toggle").addEventListener("click", () => {
  const c = $("agents").classList.toggle("collapsed");
  $("ag-toggle").setAttribute("aria-expanded", String(!c)); $("ag-toggle").innerHTML = `<i data-lucide="${c ? "chevron-down" : "chevron-up"}"></i>`; icons();
});
// The scout finds signals; rules apply the small ones; the big one waits for a person in the admin view.
let scoutState = "idle"; // idle | running | flagged | done
$("scout").addEventListener("click", () => {
  if (scoutState === "flagged") { setAdmin(true); return; }
  if (scoutState !== "idle") return;
  scoutState = "running";
  const btn = $("scout"), log = $("log"), D = reduce ? 0.3 : 1;
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Scouting…'; log.hidden = false; log.innerHTML = "";
  renderAgents({ scout: "Searching…", scoutSt: "run" });
  [[400, "Searched 30 skills across 6 source types"], [1100, "Read 312 pages · 41 relevant after removing duplicates"], [1800, "5 small, well-sourced changes applied automatically"], [2500, "1 big change flagged for human review: vendor reconciliation"]]
    .forEach(([t, x]) => setTimeout(() => { const li = document.createElement("li"); li.textContent = x; log.appendChild(li); }, t * D));
  setTimeout(() => {
    scoutState = "flagged";
    REVIEW.find(r => r.id === "s1").status = "pending"; updateAdminCount();
    $("ag-fresh").textContent = "Scout ran just now";
    renderAgents({ scout: "1 change waiting for human review", scoutSt: "run" });
    btn.disabled = false; btn.innerHTML = '<i data-lucide="shield-check"></i>Review flagged change'; $("reset").hidden = false; icons();
    toast("1 change needs a human", `${SIGNAL.title}. It would reroute 1,240 users, so the rules sent it for review. Nothing changes until it is approved.`, '<span class="badge b-warn">Flagged</span>');
    if (UI.admin) renderPanel();
  }, 3000 * D);
});
$("reset").addEventListener("click", () => {
  S.signal = false; S.extraE = {}; S.extraD = {}; scoutState = "idle";
  REVIEW.forEach((r, i) => r.status = REVIEW_INIT[i]);
  Object.keys(EMERGING).forEach(k => EMERGING[k].status = EMERGING_INIT[k]);
  $("reset").hidden = true; $("log").hidden = true; $("scout").disabled = false; $("scout").innerHTML = '<i data-lucide="radar"></i>Run market scout';
  $("fresh-when").textContent = "3 days ago"; $("fresh-n").textContent = "214"; $("ag-fresh").textContent = "Scout ran 3 days ago";
  renderAgents({}); updateAdminCount(); refresh();
});
$("admin-btn").addEventListener("click", () => setAdmin(!UI.admin));

// ============ onboarding ============
const OB = { step: 0, read: false, answers: {} };
const QUESTIONS = [
  { id: "pay", q: "You mention SAP. Do you also run the weekly payment batch?", a: ["Yes, every week", "Sometimes", "No"] },
  { id: "exc", q: "When the system can't match an invoice, do you resolve it yourself or pass it on?", a: ["I resolve it myself", "I pass it on"] },
  { id: "hours", q: "How many hours a week can you spend learning?", a: ["3 h", "6 h", "10 h"] }
];
function obRender() {
  const c = $("ob-card"), s = OB.step;
  const bars = `<div class="ob-steps">${[0, 1, 2].map(i => `<i class="${i <= s ? "on" : ""}"></i>`).join("")}</div>`;
  let head = "", body = "", foot = "";
  if (s === 0) {
    head = `<div class="ob-kicker">Step 1 of 3 · Your experience</div><h2 id="ob-title">Start with what you've already done</h2><p>Upload your LinkedIn profile PDF or CV. You won't type your experience twice.</p>`;
    body = `<div class="drop"><span class="ic"><i data-lucide="upload"></i></span>
        <div class="file"><span class="fi"><i data-lucide="file-text"></i></span><div><div style="font-weight:600;font-size:13.5px">Priya_Nair_LinkedIn.pdf</div><div class="fm">Sample file · 2 pages</div></div><i data-lucide="check" style="color:var(--good)"></i></div></div>
      ${OB.read ? `<ul class="found-list" id="found-list">
        <li><i data-lucide="circle-check"></i>11 years in accounts payable at a shared-services centre</li>
        <li><i data-lucide="circle-check"></i>12 skills found, 10 matched to our skill list</li>
        <li><i data-lucide="circle-check"></i>Tools: SAP, Excel</li>
        <li class="warn"><i data-lucide="circle-help"></i>3 things are unclear, so we'll ask you</li></ul>` : ""}`;
    foot = `<span class="left"><i data-lucide="lock"></i>Your file stays private. We never use age, gender, race or religion.</span>
      <button class="btn btn-primary" id="ob-next" type="button">${OB.read ? 'Continue<i data-lucide="arrow-right"></i>' : '<i data-lucide="sparkles"></i>Read my profile'}</button>`;
  } else if (s === 1) {
    head = `<div class="ob-kicker">Step 2 of 3 · A few questions</div><h2 id="ob-title">Our interviewer has 3 quick questions</h2><p>Your profile left a few gaps. Your answers make the match more accurate.</p>`;
    body = QUESTIONS.map(q => `<div class="q"><div class="q-msg"><span class="bot"><i data-lucide="bot"></i></span><div class="bubble">${q.q}</div></div>
      <div class="q-ans">${q.a.map(a => `<button type="button" data-q="${q.id}" data-a="${a}" aria-pressed="${OB.answers[q.id] === a}">${a}</button>`).join("")}</div></div>`).join("");
    foot = `<button class="ghost" id="ob-back" type="button"><i data-lucide="arrow-left"></i>Back</button>
      <button class="btn btn-primary" id="ob-next" type="button" ${Object.keys(OB.answers).length < 3 ? "disabled" : ""}>Continue<i data-lucide="arrow-right"></i></button>`;
  } else {
    head = `<div class="ob-kicker">Step 3 of 3 · Your skills</div><h2 id="ob-title">Check your skills and levels</h2><p>We pre-filled these from your profile. Adjust anything that's off. You can prove any skill later with a short check.</p>`;
    body = `<div class="rate">${OWNED.map(k => `<div class="rate-row"><div class="rn">${NODES[k].name} ${confBadge(k)}</div>
        <div class="lv" role="group" aria-label="${NODES[k].name} level">${[1, 2, 3, 4, 5].map(i => `<button type="button" data-k="${k}" data-l="${i}" aria-pressed="${lvl(k) === i}">${i}</button>`).join("")}</div>
        <div class="rd">Level ${lvl(k)}: ${LEVELS[lvl(k)]}</div></div>`).join("")}</div>`;
    foot = `<button class="ghost" id="ob-back" type="button"><i data-lucide="arrow-left"></i>Back</button>
      <button class="btn btn-primary" id="ob-next" type="button"><i data-lucide="sparkles"></i>Build my career map</button>`;
  }
  c.innerHTML = `<div class="ob-top">${bars}<div>${head}</div></div><div class="ob-body">${body}</div><div class="ob-foot">${foot}</div>`;
  icons();
  const next = $("ob-next"), back = $("ob-back");
  if (back) back.addEventListener("click", () => { OB.step--; obRender(); });
  c.querySelectorAll("[data-q]").forEach(b => b.addEventListener("click", () => {
    OB.answers[b.dataset.q] = b.dataset.a;
    if (b.dataset.q === "hours") PROFILE.hours = parseInt(b.dataset.a, 10);
    if (b.dataset.q === "exc" && b.dataset.a === "I resolve it myself") PROFILE.level.three = 5;
    obRender();
  }));
  c.querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", () => {
    PROFILE.level[b.dataset.k] = +b.dataset.l;
    if (PROFILE.conf[b.dataset.k] !== "verified") PROFILE.conf[b.dataset.k] = "self";
    obRender();
  }));
  next.addEventListener("click", () => {
    if (s === 0 && !OB.read) {
      next.disabled = true; next.innerHTML = '<span class="spin"></span>Reading…';
      setTimeout(() => { OB.read = true; obRender(); if (window.gsap && !reduce) gsap.from("#found-list li", { opacity: 0, x: -6, stagger: 0.12, duration: 0.3, ease: "power3.out" }); }, reduce ? 200 : 1100);
      return;
    }
    if (s < 2) { OB.step++; obRender(); if (window.gsap && !reduce) gsap.from(".ob-body", { opacity: 0, y: 8, duration: 0.3, ease: "power3.out" }); return; }
    finishOnboarding();
  });
}
function finishOnboarding() {
  const done = () => { $("ob").hidden = true; refresh(false, true); toast("Your career map is ready", `${UI.ring.length} jobs found. Best match: ${NODES[UI.ring[0]].name}. Try the sector chips to explore more.`, '<span class="badge b-good">Ready</span>'); };
  if (window.gsap && !reduce) gsap.to("#ob", { opacity: 0, duration: 0.3, ease: "power2.out", onComplete: () => { done(); gsap.set("#ob", { opacity: 1 }); } });
  else done();
}
$("replay").addEventListener("click", () => { OB.step = 0; OB.read = false; OB.answers = {}; $("ob").hidden = false; obRender(); });

// ============ boot ============
new MutationObserver(restyle).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", restyle);
new ResizeObserver(() => { if (Graph) Graph.width($("graph").clientWidth).height($("graph").clientHeight); drawStars(); }).observe($("stage"));
computeRing(); computePlans(); applyLayout(false);
renderHead(); renderPanel(); renderAgents();
initGraph(); drawStars(); obRender(); updateAdminCount(); icons();
</script>
</body>
</html>
